<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Work Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#18233A; --muted:#5E6A80; --line:#D9DEE7;
  --accent:#1F7A55; --accent-ink:#FFFFFF; --soft:#E3F1EA; --danger:#B3261E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151F; --surface:#1A2130; --ink:#E9EDF4; --muted:#9AA5B8; --line:#2B3446;
    --accent:#4CC28E; --accent-ink:#0C1A13; --soft:#1C3329; --danger:#F2867E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151F; --surface:#1A2130; --ink:#E9EDF4; --muted:#9AA5B8; --line:#2B3446;
  --accent:#4CC28E; --accent-ink:#0C1A13; --soft:#1C3329; --danger:#F2867E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.01em}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.9rem;font-weight:600}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.2rem}
.month strong{font-size:1.1rem}
.total{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px}
.total .amt{font-size:2.6rem;font-weight:800;line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.total .sub{opacity:.85;font-size:.95rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stats div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:1.4rem}
.stats span{font-size:.85rem;opacity:.9}
.add{display:block;width:100%;margin:16px 0 22px;padding:16px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);font:inherit;font-size:1.05rem;font-weight:700}
h2{font-size:1rem;margin:0 0 8px;color:var(--muted);font-weight:600}
.list{background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left}
.row:last-child{border-bottom:0}
.row .d{font-weight:700}
.row .m{color:var(--muted);font-size:.88rem}
.row .r{text-align:right;white-space:nowrap}
.row .r b{display:block}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.foot{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.foot button{flex:1;min-width:140px}
.status{margin-top:14px;text-align:center;font-size:.82rem;color:var(--muted)}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:1.2rem}
label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:46px}
textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font:inherit;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.preview{margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:var(--soft);font-weight:600}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.chip{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.05rem;font-weight:700}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Work hours</h1>
    <button class="iconbtn" id="settingsBtn">Rates</button>
  </header>

  <div class="month">
    <button id="prev" aria-label="Previous month">‹</button>
    <strong id="monthLabel"></strong>
    <button id="next" aria-label="Next month">›</button>
  </div>

  <section class="total" aria-live="polite">
    <div class="sub">Earned this month</div>
    <div class="amt" id="amt">0</div>
    <div class="stats">
      <div><b id="days">0</b><span>days worked</span></div>
      <div><b id="hours">0</b><span>hours</span></div>
    </div>
  </section>

  <button class="add" id="addBtn">+ Add work day</button>

  <h2 id="listTitle">Entries</h2>
  <div class="list" id="list"></div>

  <div class="foot">
    <button class="btn" id="allBtn">All-time totals</button>
    <button class="btn" id="csvBtn">Back up (CSV)</button>
    <button class="btn" id="impBtn">Restore backup</button>
    <input type="file" id="impFile" accept=".csv,text/csv" class="hide">
  </div>
  <div class="status" id="status">Loading…</div>
</div>

<!-- entry sheet -->
<div class="overlay" id="entryOv">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
    <h3 id="entryTitle">Add work day</h3>
    <label for="fDate">Date</label>
    <input type="date" id="fDate">
    <label>Enter time as</label>
    <div class="seg"><button id="modeTimes" class="on" type="button">Start & end</button><button id="modeHours" type="button">Total hours</button></div>
    <div id="timesBox">
      <div class="grid2">
        <div><label for="fStart">Start</label><input type="time" id="fStart" value="09:00"></div>
        <div><label for="fEnd">End</label><input type="time" id="fEnd" value="17:00"></div>
      </div>
      <label for="fBreak">Unpaid break (minutes)</label>
      <input type="number" id="fBreak" inputmode="numeric" min="0" step="5" value="0">
    </div>
    <div id="hoursBox" class="hide">
      <label for="fHours">Hours worked</label>
      <input type="text" id="fHours" inputmode="decimal" placeholder="e.g. 7,5">
    </div>
    <label for="fRate">Rate per hour</label>
    <div class="chips" id="rateChips"></div>
    <input type="text" id="fRate" inputmode="decimal" placeholder="Or type another rate">
    <label for="fNote">Note (optional)</label>
    <input type="text" id="fNote" placeholder="Client, job, location…">
    <div class="preview" id="preview"></div>
    <div class="actions">
      <button class="btn danger hide" id="delBtn" type="button">Delete</button>
      <button class="btn" id="cancelBtn" type="button">Cancel</button>
      <button class="btn primary" id="saveBtn" type="button">Save</button>
    </div>
  </div>
</div>

<!-- settings sheet -->
<div class="overlay" id="setOv">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h3 id="setTitle">Your hourly rates</h3>
    <div class="grid2">
      <div><label for="sRate">Rate 1</label><input type="text" id="sRate" inputmode="decimal"></div>
      <div><label for="sRate2">Rate 2</label><input type="text" id="sRate2" inputmode="decimal"></div>
    </div>
    <label for="sCur">Currency symbol</label>
    <input type="text" id="sCur" maxlength="4" placeholder="$">
    <p style="color:var(--muted);font-size:.88rem;margin:10px 0 0">Both rates appear as quick buttons when you add a day. Days you already saved keep their own rate.</p>
    <div class="actions">
      <button class="btn" id="setCancel" type="button">Cancel</button>
      <button class="btn primary" id="setSave" type="button">Save rate</button>
    </div>
  </div>
</div>

<!-- all-time sheet -->
<div class="overlay" id="allOv">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="allTitle">
    <h3 id="allTitle">All-time totals</h3>
    <div id="allBody"></div>
    <div class="actions"><button class="btn primary" id="allClose" type="button">Close</button></div>
  </div>
</div>

<script>
(function(){
  var LS_KEY = "workhours-v1";
  var state = { rate: 241.31, rate2: 231.31, currency: "$", entries: [] };
  var view = new Date(); view.setDate(1);
  var editingId = null, mode = "times";

  var $ = function(id){ return document.getElementById(id); };
  var statusEl = $("status");

  function money(n){
    var v = (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    return (state.currency || "") + v;
  }
  function num(v){ return parseFloat(String(v).replace(/\s/g,"").replace(",","."))||0; }
  function rateStr(r){ return r ? Number(r).toLocaleString(undefined,{useGrouping:false,maximumFractionDigits:2}) : ""; }
  function hrs(n){ return (Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2}); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function fmtDate(s){ var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}); }
  function calcTimes(start,end,brk){
    if(!start||!end) return 0;
    var a=start.split(":"), b=end.split(":");
    var m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);
    if(m<=0) m+=1440; // overnight shift
    m-= (+brk||0);
    return Math.max(0,m/60);
  }

  // ---------- storage ----------
  function loadLocal(){
    try{ var raw=localStorage.getItem(LS_KEY); if(raw){ var d=JSON.parse(raw); if(d&&Array.isArray(d.entries)) state=Object.assign(state,d); } }catch(e){}
  }
  function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

  function persist(){ saveLocal(); statusEl.textContent = "Saved on this phone"; }

  // ---------- render ----------
  function render(){
    var key = monthKey(view);
    $("monthLabel").textContent = view.toLocaleDateString(undefined,{month:"long",year:"numeric"});
    var items = state.entries.filter(function(e){ return e.date.slice(0,7)===key; })
      .sort(function(a,b){ return b.date.localeCompare(a.date) || (b.start||"").localeCompare(a.start||""); });
    var totalH=0,totalA=0,days={};
    items.forEach(function(e){ totalH+=e.hours; totalA+=e.hours*e.rate; days[e.date]=1; });
    $("amt").textContent = money(totalA);
    $("days").textContent = Object.keys(days).length;
    $("hours").textContent = hrs(totalH);
    $("listTitle").textContent = items.length ? items.length+(items.length===1?" entry":" entries") : "Entries";
    var list = $("list"); list.innerHTML="";
    if(!items.length){
      var em=document.createElement("div"); em.className="empty";
      em.textContent = state.rate ? "No work days this month yet. Tap “Add work day” to log one." : "Set your hourly rate first, then add your work days.";
      list.appendChild(em); return;
    }
    items.forEach(function(e){
      var b=document.createElement("button"); b.className="row"; b.type="button";
      var l=document.createElement("div");
      var d=document.createElement("div"); d.className="d"; d.textContent=fmtDate(e.date);
      var m=document.createElement("div"); m.className="m";
      var parts=[]; if(e.start&&e.end) parts.push(e.start+"–"+e.end+(e.brk?" (−"+e.brk+"m)":"")); parts.push(hrs(e.hours)+" h × "+money(e.rate)); if(e.note) parts.push(e.note);
      m.textContent=parts.join(", ");
      l.appendChild(d); l.appendChild(m);
      var r=document.createElement("div"); r.className="r";
      var rb=document.createElement("b"); rb.textContent=money(e.hours*e.rate); r.appendChild(rb);
      b.appendChild(l); b.appendChild(r);
      b.addEventListener("click",function(){ openEntry(e); });
      list.appendChild(b);
    });
  }

  // ---------- entry sheet ----------
  function setMode(m){
    mode=m;
    $("modeTimes").classList.toggle("on",m==="times");
    $("modeHours").classList.toggle("on",m==="hours");
    $("timesBox").classList.toggle("hide",m!=="times");
    $("hoursBox").classList.toggle("hide",m!=="hours");
    updatePreview();
  }
  function currentHours(){
    return mode==="times" ? calcTimes($("fStart").value,$("fEnd").value,$("fBreak").value) : Math.max(0,num($("fHours").value));
  }
  function updatePreview(){
    var h=currentHours(), r=num($("fRate").value);
    syncChips();
    $("preview").textContent = hrs(h)+" hours × "+money(r)+" = "+money(h*r);
  }
  function openEntry(e){
    editingId = e ? e.id : null;
    $("entryTitle").textContent = e ? "Edit work day" : "Add work day";
    $("delBtn").classList.toggle("hide", !e);
    if(e){
      $("fDate").value=e.date; $("fRate").value=rateStr(e.rate); $("fNote").value=e.note||"";
      if(e.start&&e.end){ $("fStart").value=e.start; $("fEnd").value=e.end; $("fBreak").value=e.brk||0; setMode("times"); }
      else { $("fHours").value=e.hours; setMode("hours"); }
    } else {
      var inMonth = monthKey(view)===monthKey(new Date());
      $("fDate").value = inMonth ? todayStr() : monthKey(view)+"-01";
      $("fRate").value = rateStr(state.rate); $("fNote").value=""; $("fHours").value="";
      var last = state.entries.slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0];
      if(last && last.start){ $("fStart").value=last.start; $("fEnd").value=last.end; $("fBreak").value=last.brk||0; }
      setMode(last && !last.start ? "hours" : "times");
    }
    renderChips();
    updatePreview();
    $("entryOv").classList.add("open");
  }
  function closeEntry(){ $("entryOv").classList.remove("open"); }
  function renderChips(){
    var box=$("rateChips"); box.innerHTML="";
    [state.rate,state.rate2].forEach(function(r){
      if(!r) return;
      var b=document.createElement("button"); b.type="button"; b.className="chip"; b.dataset.rate=r; b.textContent=money(r);
      b.onclick=function(){ $("fRate").value=rateStr(r); updatePreview(); };
      box.appendChild(b);
    });
  }
  function syncChips(){
    var v=num($("fRate").value);
    document.querySelectorAll("#rateChips .chip").forEach(function(c){ c.classList.toggle("on", Math.abs(+c.dataset.rate - v)<0.001); });
  }

  function saveEntry(){
    var date=$("fDate").value;
    if(!date){ $("preview").textContent="Pick a date to save this day."; return; }
    var h=currentHours();
    if(h<=0){ $("preview").textContent="Enter the hours worked to save this day."; return; }
    var e = { id: editingId || (Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
      date:date, hours:Math.round(h*100)/100, rate:num($("fRate").value), note:$("fNote").value.trim() };
    if(mode==="times"){ e.start=$("fStart").value; e.end=$("fEnd").value; e.brk=parseInt($("fBreak").value,10)||0; }
    if(editingId){ state.entries = state.entries.map(function(x){ return x.id===editingId?e:x; }); }
    else state.entries.push(e);
    var p=date.split("-"); view=new Date(+p[0],+p[1]-1,1);
    closeEntry(); render(); persist();
  }
  function deleteEntry(){
    if(!editingId) return;
    if(!confirm("Delete this work day?")) return;
    state.entries = state.entries.filter(function(x){ return x.id!==editingId; });
    closeEntry(); render(); persist();
  }

  // ---------- settings ----------
  function openSettings(){ $("sRate").value=rateStr(state.rate); $("sRate2").value=rateStr(state.rate2); $("sCur").value=state.currency; $("setOv").classList.add("open"); }
  function saveSettings(){
    state.rate=num($("sRate").value); state.rate2=num($("sRate2").value); state.currency=$("sCur").value;
    $("setOv").classList.remove("open"); render(); persist();
  }

  // ---------- all-time ----------
  function openAll(){
    var byMonth={}, H=0,A=0,D={};
    state.entries.forEach(function(e){
      var k=e.date.slice(0,7); byMonth[k]=byMonth[k]||{h:0,a:0,d:{}};
      byMonth[k].h+=e.hours; byMonth[k].a+=e.hours*e.rate; byMonth[k].d[e.date]=1;
      H+=e.hours; A+=e.hours*e.rate; D[e.date]=1;
    });
    var body=$("allBody"); body.innerHTML="";
    var top=document.createElement("div"); top.className="preview";
    top.textContent=Object.keys(D).length+" days, "+hrs(H)+" hours, "+money(A)+" total";
    body.appendChild(top);
    var keys=Object.keys(byMonth).sort().reverse();
    if(keys.length){
      var list=document.createElement("div"); list.className="list"; list.style.marginTop="12px";
      keys.forEach(function(k){
        var m=byMonth[k], p=k.split("-");
        var row=document.createElement("div"); row.className="row";
        var l=document.createElement("div");
        var t=document.createElement("div"); t.className="d"; t.textContent=new Date(+p[0],+p[1]-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
        var s=document.createElement("div"); s.className="m"; s.textContent=Object.keys(m.d).length+" days, "+hrs(m.h)+" h";
        l.appendChild(t); l.appendChild(s);
        var r=document.createElement("div"); r.className="r"; var b=document.createElement("b"); b.textContent=money(m.a); r.appendChild(b);
        row.appendChild(l); row.appendChild(r); list.appendChild(row);
      });
      body.appendChild(list);
    }
    $("allOv").classList.add("open");
  }

  // ---------- CSV ----------
  async function exportCsv(){
    var rows=[["Date","Start","End","Break (min)","Hours","Rate","Amount","Note"]];
    state.entries.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){
      rows.push([e.date,e.start||"",e.end||"",e.brk||"",e.hours,e.rate,(Math.round(e.hours*e.rate*100)/100),e.note||""]);
    });
    var csv=rows.map(function(r){ return r.map(function(v){ v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(","); }).join("\n");
    var name="work-hours-"+todayStr()+".csv";
    var blob=new Blob(["\ufeff"+csv],{type:"text/csv"});
    try{
      var file=new File([blob],name,{type:"text/csv"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:name});
        statusEl.textContent="Backup ready. Choose “Save to Files” to keep it on your phone.";
        return;
      }
    }catch(e){ if(e && e.name==="AbortError"){ statusEl.textContent="Backup cancelled"; return; } }
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
    statusEl.textContent="Backup saved";
  }

  function parseCsv(t){
    var rows=[],row=[],f="",q=false;
    for(var i=0;i<t.length;i++){ var c=t[i];
      if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
      else if(c==='"') q=true;
      else if(c===','){ row.push(f); f=""; }
      else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
      else if(c!=='\r') f+=c;
    }
    if(f||row.length){ row.push(f); rows.push(row); }
    return rows;
  }

  // ---------- wire up ----------
  $("prev").onclick=function(){ view=new Date(view.getFullYear(),view.getMonth()-1,1); render(); };
  $("next").onclick=function(){ view=new Date(view.getFullYear(),view.getMonth()+1,1); render(); };
  $("addBtn").onclick=function(){ if(!state.rate && !state.entries.length){ openSettings(); } else openEntry(null); };
  $("settingsBtn").onclick=openSettings;
  $("setCancel").onclick=function(){ $("setOv").classList.remove("open"); };
  $("setSave").onclick=saveSettings;
  $("modeTimes").onclick=function(){ setMode("times"); };
  $("modeHours").onclick=function(){ setMode("hours"); };
  ["fStart","fEnd","fBreak","fHours","fRate"].forEach(function(id){ $(id).addEventListener("input",updatePreview); });
  $("cancelBtn").onclick=closeEntry;
  $("saveBtn").onclick=saveEntry;
  $("delBtn").onclick=deleteEntry;
  $("allBtn").onclick=openAll;
  $("allClose").onclick=function(){ $("allOv").classList.remove("open"); };
  $("csvBtn").onclick=exportCsv;
  $("impBtn").onclick=function(){ $("impFile").click(); };
  $("impFile").onchange=function(ev){
    var f=ev.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var rows=parseCsv(String(rd.result)), added=0;
      var seen={}; state.entries.forEach(function(e){ seen[e.date+"|"+(e.start||"")+"|"+e.hours]=1; });
      rows.forEach(function(r){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(r[0]||"")) return;
        var e={ id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), date:r[0], hours:num(r[4]), rate:num(r[5]), note:r[7]||"" };
        if(r[1]&&r[2]){ e.start=r[1]; e.end=r[2]; e.brk=parseInt(r[3],10)||0; }
        var k=e.date+"|"+(e.start||"")+"|"+e.hours;
        if(e.hours>0 && !seen[k]){ seen[k]=1; state.entries.push(e); added++; }
      });
      render(); persist();
      statusEl.textContent = added ? "Restored "+added+(added===1?" day":" days") : "No new days found in that file";
    };
    rd.readAsText(f); ev.target.value="";
  };
  document.querySelectorAll(".overlay").forEach(function(ov){
    ov.addEventListener("click",function(ev){ if(ev.target===ov) ov.classList.remove("open"); });
  });

  loadLocal(); render();
  statusEl.textContent="Saved on this phone only";
})();
</script>
</body>
</html>
